[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reticulumpi"
version = "0.2.0"
description = "An extensible Reticulum network node for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "rns>=1.1.0,<2.0",
    "lxmf>=0.9.0,<1.0",
    "pyyaml>=6.0,<8.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
nomadnet = [
    "nomadnet>=0.5,<1.0",
]
dashboard = [
    "aiohttp>=3.9,<4.0",
]
lora = [
    "rnodeconf>=2.0,<3.0",
]
sensors = [
    "smbus2>=0.4,<1.0",
    "RPi.GPIO>=0.7,<1.0",
]
meshtastic = [
    "meshtastic>=2.0,<3.0",
    "paho-mqtt>=2.0,<3.0",
    "cryptography>=3.0,<5.0",
]
meshcore = [
    "meshcore>=2.3,<3.0",
    "paho-mqtt>=2.0,<3.0",
]
space = [
    "sgp4>=2.20,<3.0",
]
gps = [
    "pyserial>=3.5,<4.0",
    "pynmea2>=1.19,<2.0",
]
adsb = [
    "pyModeS>=2.0",
]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist",
    "pytest-timeout",
    "ruff",
]

[project.scripts]
reticulumpi = "reticulumpi.cli:main"

[tool.setuptools.package-data]
reticulumpi = ["data/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n 2 leaves a core free for the OS/thermals on a 4-core Pi; override with -n0 for debugging.
# timeout guards against hangs on a slow/throttled Pi without masking real slow tests.
addopts = "-n 2 --timeout=60 --timeout-method=thread"
markers = [
    "integration: tests that require a real Reticulum instance",
]
