[build-system]
requires = ["setuptools==83.0.0", "setuptools-scm==10.2.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reticulumpi"
dynamic = ["version"]
description = "An extensible Reticulum network node for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "rns>=1.2.5,<2.0",
    "lxmf>=0.9.4,<2.0",
    "pyyaml>=6.0,<8.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
nomadnet = [
    "nomadnet>=0.5,<2.0",
]
dashboard = [
    "aiohttp>=3.14.3,<4.0",
]
lora = [
    "rnodeconf>=1.3.1,<2.0",
]
sensors = [
    "smbus2>=0.4,<1.0",
    "RPi.GPIO>=0.7,<1.0",
]
meshtastic = [
    # Host SDK compatibility adapter is qualified against this exact API.
    # This does not pin the firmware installed on the physical radio.
    "meshtastic==2.7.10",
    "paho-mqtt>=2.0,<3.0",
    "cryptography>=50.0.0,<51.0",
]
meshcore = [
    "meshcore>=2.3,<3.0",
    "paho-mqtt>=2.0,<3.0",
    # MeshCore exports its Ed25519 identity in the 64-byte expanded format.
    # PyNaCl supplies the group operations used by the local JWT fallback.
    "PyNaCl>=1.5,<2.0",
]
space = [
    "sgp4>=2.20,<3.0",
]
gps = [
    "pyserial>=3.5,<4.0",
    "pynmea2>=1.19,<2.0",
]
adsb = [
    "pyModeS>=2.0",
]
dev = [
    "aiohttp>=3.14.3,<4.0",
    "cryptography>=50.0.0,<51.0",
    # The full CI suite exercises MeshCore's expanded Ed25519 signing fallback.
    "PyNaCl>=1.5,<2.0",
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=7.0,<8.0",
    "pytest-mock>=3.15,<4.0",
    "pytest-xdist>=3.8,<4.0",
    "pytest-asyncio>=1.3,<2.0",
    "pytest-timeout>=2.4,<3.0",
    "pynmea2>=1.19,<2.0",
    "sgp4>=2.20,<3.0",
    "build>=1.4,<2.0",
    "setuptools==83.0.0",
    "setuptools-scm==10.2.0",
    "twine>=6.2,<7.0",
    "wheel==0.47.0",
    "ruff==0.15.21",
]

[project.scripts]
reticulumpi = "reticulumpi.cli:main"
reticulumpi-admin = "reticulumpi.admin_cli:main"

[tool.setuptools.package-data]
reticulumpi = [
    "data/*.pydata",
    "data/*.yaml",
    "builtin_plugins/web_dashboard/static/*",
    "builtin_plugins/web_dashboard/static/assets/*",
    "builtin_plugins/web_dashboard/static/vendor/*",
    "builtin_plugins/web_dashboard/static/vendor/images/*",
]

[tool.setuptools.data-files]
"share/reticulumpi/nomadnet/pages" = [
    "config/nomadnet/pages/*.mu",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/reticulumpi/_version.py"
fallback_version = "0+unknown"
parentdir_prefix_version = "reticulumpi-"
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
version_scheme = "no-guess-dev"

[tool.coverage.report]
fail_under = 50
show_missing = true

[tool.coverage.run]
branch = true
source = ["src/reticulumpi"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n 2 leaves a core free for the OS/thermals on a 4-core Pi; override with -n0 for debugging.
# timeout guards against hangs on a slow/throttled Pi without masking real slow tests.
addopts = "-n 2 --timeout=60 --timeout-method=thread"
filterwarnings = ["error"]
markers = [
    "integration: tests that require a real Reticulum instance",
]
