    #  meshcore:
    #    enabled: true               # Bridges to meshcore_gateway plugin

    # Mesh Bridge — bidirectional relay between Meshtastic and MeshCore.
    # Subscribes to inbound messages on both networks and forwards broadcasts
    # (and optionally DMs) to the opposite mesh with an origin tag.
    # Requires: meshtastic_gateway AND meshcore_gateway enabled.
    # Strongly recommended: messaging_hub enabled (bridged messages then
    # appear in the dashboard and are persisted to SQLite).
    #mesh_bridge:
    #  enabled: false
    #
    #  # Broadcast channel pairs (default pair relays Meshtastic Primary ↔ MeshCore ch0)
    #  channel_pairs:
    #    - meshtastic: 0
    #      meshcore: 0
    #      enabled: true
    #      direction: both            # both | mesh_to_core | core_to_mesh
    #      # allow_regex: null        # if set, only matching messages relay
    #      # deny_regex: null         # if set, matching messages are dropped
    #
    #  # Origin tags (kept short — Meshtastic MTU is 233 bytes)
    #  tag_mesh: "[via Mesh]"
    #  tag_core: "[via Core]"
    #
    #  # Loop prevention
    #  loop_detect_regex: '^\[via (Mesh|Core)\]\s'
    #  dedup_ttl_seconds: 60
    #  dedup_max_entries: 256
    #
    #  # MTU (override only if hardware differs)
    #  meshtastic_mtu: 233
    #  meshcore_mtu: 240
    #
    #  # DM bridging — off by default.  Requires explicit identity pairs to
    #  # prevent unintended cross-network leakage of private messages.
    #  bridge_dms: false
    #  dm_pairs: []
    #  # dm_pairs:
    #  #   - meshtastic: "!abcd1234"
    #  #     meshcore: "3c5a1f8e9012"
    #
    #  # Content filters — block auto-generated chatter that's annoying
    #  # when relayed across networks.  Both default to true.
    #  filter_position_shares: true   # drops "X has shared their position/location"
    #  filter_tapbacks: true          # drops short emoji/symbol-only reactions
    #
    #  # Observability
    #  log_dropped: true              # log every dropped message with reason
    #
    #  # Runtime safety — circuit breaker auto-pauses if traffic spikes.
    #  # Set auto_pause_threshold to 0 to disable.  Resume is manual (dashboard
    #  # toggle, API call, or `reticulumpi --mesh-bridge resume`) to prevent
    #  # a flapping mesh from silently re-enabling.
    #  auto_pause_threshold: 20       # messages relayed in 60s to trip
    #  default_running: true          # initial runtime state on first boot
    #
    #  # Startup grace — drop all inbound events for the first N seconds
    #  # after the plugin starts.  This prevents re-broadcasting messages
    #  # queued in the MeshCore device buffer (drained on reconnect) or
    #  # backlogged MQTT broadcasts from before the service restart.
    #  # Set to 0 to disable (not recommended on a live mesh).
    #  startup_grace_seconds: 30

    # Meshtastic Responder — auto-replies to Meshtastic and MeshCore
    # messages with commands.
    # Requires: meshtastic_gateway and/or meshcore_gateway enabled.
    # Built-in commands: help, ping, time, uptime, nodes, weather, fortune,
