    # Messaging Hub — unified message store and chat UI.
    # Stores all messages in SQLite, bridges LXMF, Meshtastic, and MeshCore.
    # Provides transport-agnostic send/receive from the web dashboard.
    # Requires: web_dashboard enabled for the chat UI.
    #messaging_hub:
    #  enabled: false
    #  db_path: ~/.local/share/reticulumpi/messaging_hub.db
    #  message_history_limit: 500    # Max stored messages PER transport (0 = unlimited)
