    # Space Tracker — satellites (Celestrak TLEs), upcoming launches
    # (Launch Library 2), and space weather (NOAA SWPC Kp index).
    # All data is fetched from public HTTPS APIs with strict rate limiting
    # — minimum intervals are enforced and cannot be lowered below the
    # floors shown (etiquette requirements of the upstream services).
    # Optional deps for orbital propagation / pass prediction:
    #   pip install sgp4       # sub-satellite points
    #   pip install skyfield   # observer az/el + pass prediction
    #space_tracker:
    #  enabled: false
    #  # Observer location used for az/el + pass prediction.
    #  # Leave latitude/longitude null to pick them up from the
    #  # gps_telemetry plugin automatically (when that is enabled).
    #  observer:
    #    latitude: null               # degrees, -90 to 90
    #    longitude: null              # degrees, -180 to 180
    #    elevation_m: 0
    #  # Which Celestrak satellite groups to track.  See
    #  # https://celestrak.org/NORAD/elements/ for the full list.
    #  celestrak_groups:
    #    - stations                   # ISS, CSS, HST
    #    - amateur                    # Amateur radio satellites
    #    - weather                    # Weather satellites
    #    - noaa                       # NOAA APT-capable sats
    #  tle_refresh_hours: 24          # Floor: 6h (Celestrak etiquette)
    #  launches:
    #    enabled: true
    #    poll_interval_minutes: 30    # Floor: 15 (LL2 free-tier quota)
    #    lookahead_count: 5
    #  space_weather:
    #    enabled: true
    #    poll_interval_minutes: 15    # Floor: 10
    #  propagation:
    #    enabled: true                # No-op if sgp4 not installed
    #    interval_seconds: 10
    #    max_objects: 200
    #  passes:
    #    enabled: true                # No-op if skyfield not installed
    #    lookahead_hours: 24
    #    min_elevation_deg: 10
    #    watchlist:
    #      - "ISS (ZARYA)"
    #      - "NOAA 15"
    #      - "NOAA 18"
    #      - "NOAA 19"
    #  cache_dir: ~/.local/share/reticulumpi/space_tracker
    #  # Please set contact info in the user-agent so upstream operators can
    #  # reach you if something goes wrong with your node.
    #  user_agent: "reticulumpi/0.2 (+https://example.invalid/contact)"
    #  request_timeout_seconds: 15

    # --------------------------------------------------------------------
    # RTL-SDR device mapping
    #
    # Each SDR plugin needs its own dedicated RTL-SDR dongle (USB devices
    # are exclusive — only one process can claim each at a time).  Use
    # device_serial for stable binding across reboots (USB enumeration
    # order can change); device_index is a fragile fallback.
    #
    # Serials are resolved to numeric indices at plugin start via rtl_test.
    # Run `rtl_test -t` to list attached devices and their serial numbers.
    #
    # Example 2-dongle setup:
    #   spectrum_scanner:  device_serial: "07143901"  # Nooelec SMArTee XTR (wideband + LoRa presets)
    #   adsb_radar:        device_serial: "00000001"  # RTL-SDR Blog V4 (1090 MHz ADS-B)
    # --------------------------------------------------------------------

    # SDR spectrum scanner — RTL-SDR sweep feeding a waterfall panel in
    # the dashboard.  Publishes a rolling set of FFT sweeps from rtl_power
    # to the web dashboard; read-only (no transmit).
    #
    # Supports runtime frequency switching via presets.  The user picks a
    # preset in the dashboard; the scanner kills rtl_power, reconfigures
    # freq/bin/gain, and relaunches (1-3 s gap).  Three built-in presets
    # ship by default (FM Broadcast, LoRa US915, Aviation) and custom
    # presets can be added under the `presets:` key.
    #
    # When the active preset has `analysis: lora_us915`, the scanner runs
    # LoRa channel-level analysis (per-channel power, duty cycle, activity
    # detection, CW interference flags) — the same analysis that the old
    # standalone lora_scanner plugin provided.
    #
    # Requires:
    #   * rtl_power, rtl_test on PATH (apt install rtl-sdr)
    #   * Kernel DVB-T driver blacklisted so userspace can claim the dongle
    #     (see /etc/modprobe.d/blacklist-rtlsdr.conf)
    #   * The reticulumpi user must be in the plugdev group
    #     (the rtl-sdr udev rule grants device access to plugdev).
    #
    # The Elonics E4000 tuner (shipped in some NESDR SMArTee XTR units) has
    # a local-oscillator dead zone at 1101-1234 MHz — avoid spans there.
    #spectrum_scanner:
    #  enabled: false
    #  gain_db: 40.0                    # Default tuner gain (dB); overridden per preset
    #  ppm: 0                           # Tuner frequency correction (ppm)
    #  waterfall_rows: 512              # In-memory rolling history depth (8-2048)
    #  device_serial: "07143901"        # RTL-SDR USB serial (stable; run rtl_test -t to find)
    #  # device_index: 0               # Numeric index fallback (fragile; prefer device_serial)
    #  max_restarts: 5                  # Subprocess crash-restart cap (per plugin session)
    #  default_preset: fm_broadcast     # Preset to activate on startup
    #
    #  # Custom presets (merged with built-in fm_broadcast, lora_us915, aviation):
    #  presets:
    #    lora_us915:
    #      gain_db: 34.0               # Override gain for LoRa band
    #      threshold_db: 6             # Signal detection threshold above noise floor
    #    two_meter_ham:
    #      freq_start_mhz: 144.0
    #      freq_stop_mhz: 148.0
    #      bin_khz: 12.5
    #      sweep_seconds: 1
    #    frs_gmrs:
    #      freq_start_mhz: 462.0
    #      freq_stop_mhz: 467.5
    #      bin_khz: 6.25
    #      sweep_seconds: 1
    #
    #  # Flat keys (freq_start_mhz, freq_stop_mhz, etc.) still work for
    #  # backward compatibility — they become a single-preset scanner.

    # --- ADS-B radar ----------------------------------------------------------
    # Tracks nearby aircraft via an RTL-SDR dongle + dump1090.  Launches
    # dump1090 as a subprocess, connects to its SBS BaseStation TCP port, and
    # pushes live aircraft state to the web dashboard (map + table).
    # Requires: dump1090 (any fork: dump1090-mutability, dump1090-fa, readsb),
    #           plus an RTL-SDR dongle.  Optional: pip install reticulumpi[adsb]
    #           for pyModeS aircraft-category enrichment.
    # The RTL-SDR Blog V4 (R828D tuner) is recommended for ADS-B — better
    # 1090 MHz sensitivity than the E4000 (which has an L-band gap nearby).
    #adsb_radar:
    #  enabled: false
    #  dump1090_bin: dump1090              # Binary name or path
    #  device_serial: "00000001"          # RTL-SDR USB serial (stable; run rtl_test -t to find)
    #  # device_index: 2                  # Numeric index fallback (fragile; prefer device_serial)
    #  gain: max                          # Tuner gain (dB or "max")
    #  ppm: 0                             # Frequency correction (ppm)
    #  enable_bias_tee: false             # Enable bias-T power (for active antennas)
    #  sbs_port: 30003                    # SBS BaseStation TCP port
    #  stale_timeout: 300                 # Remove aircraft after N seconds without a message
    #  max_restarts: 5                    # Subprocess crash-restart cap
    #  wedge_timeout: 300                 # Seconds of zero SBS messages before killing dump1090 (dongle
    #                                     # wedge).  Set >=300 near regional airports to avoid false kills
    #                                     # during overnight low-traffic periods.
    #  patience_interval: 300             # After max_restarts exhausted, probe for dongle every N seconds
    #  receiver_lat: null                 # Receiver position for distance calc (or use GPS plugin)
    #  receiver_lon: null

    # --- FM/AM Radio Receiver -------------------------------------------------
    # Turns an RTL-SDR dongle into an FM/AM radio receiver with live audio
    # streaming to the web dashboard.  Uses rtl_fm for demodulation.
    # Requires: rtl_fm on PATH (apt install rtl-sdr), one dedicated RTL-SDR dongle.
    # Note: Cannot share a dongle with spectrum_scanner or adsb_radar.
    # Tuner range: 52-2200 MHz (E4000), 24-1766 MHz (R820T2).
    # E4000 has a dead zone at 1101-1234 MHz (L-band LO gap).
    #fm_receiver:
    #  enabled: false
    #  device_serial: "07143901"           # RTL-SDR USB serial (stable; run rtl_test -t)
    #  # device_index: 1                   # Numeric index fallback (fragile)
    #  default_frequency_mhz: 95.5         # Initial frequency (52-2200 MHz for E4000)
    #  default_mode: wbfm                  # wbfm, fm, am, usb, lsb
    #  output_rate_hz: 32000               # Audio output sample rate (32000 for WFM)
    #  gain_db: null                       # Tuner gain (null = auto; 0-42 dB manual)
    #  ppm: 0                              # Frequency correction (ppm)
    #  squelch_level: 0                    # Squelch threshold (0 = off)
    #  default_volume: 75                  # Initial volume (0-100)
    #  enable_bias_tee: false              # Enable bias-T power (active antennas)
    #  max_restarts: 5                     # Subprocess crash-restart cap
    #  auto_play: false                    # Start playing on plugin startup
    #  freq_min_mhz: 52.0                  # Tuner lower bound (E4000: 52, R820T2: 24)
    #  freq_max_mhz: 2200.0               # Tuner upper bound (E4000: 2200, R820T2: 1766)
    #  presets:                             # Custom frequency presets (merged with built-in)
    #    my_stations:
    #      label: "My Stations"
    #      mode: wbfm
    #      frequencies:
    #        - {freq_mhz: 101.1, label: "WKQX"}
    #        - {freq_mhz: 93.1, label: "WXRT"}

    # --- NTP server -----------------------------------------------------------
    # GPS-disciplined time synchronization via chrony. Monitors chrony sync
    # status and optionally configures GPS as a reference clock via gpsd shared
    # memory. Useful off-grid where internet NTP is unavailable.
    # Requires: chrony installed, chronyc on PATH.
    # For GPS discipline: gpsd running, GPS receiver connected.
    #ntp_server:
    #  enabled: false
    #  check_interval: 30                  # Seconds between chrony status checks
    #  manage_chrony_config: true           # Write/manage GPS refclock config snippet
    #  chrony_conf_dir: /etc/chrony/conf.d  # Directory for chrony config snippets
    #  sudo_chronyc: true                  # Use sudo for chronyc commands
    #  gps_refclock:
    #    enabled: true                     # Configure GPS as chrony refclock
    #    shm_segment: 0                    # gpsd SHM segment (0 = coarse time)
    #    pps_device: null                  # PPS device (e.g. /dev/pps0); null to disable
    #    precision: 1e-1                   # SHM precision (seconds)
    #    pps_precision: 1e-9               # PPS precision (seconds)
    #    offset: 0.0                       # Time offset correction (seconds)
    #    delay: 0.2                        # Network delay estimate (seconds)
    #  alert_on_sync_loss: true            # Publish alert when sync is lost
    #  sync_loss_threshold: 300            # Seconds without sync before alerting

    # --- LoRa link tester -----------------------------------------------------
    # Measures RF link quality to a remote Meshtastic device using a dedicated
    # test radio (separate from any meshtastic_gateway device).  Sends numbered
    # probe packets and records RTT, RSSI, SNR, and packet loss.  Results are
    # streamed to the web dashboard for real-time charting.
    # Requires: pip install reticulumpi[meshtastic]
    # Hardware: any Meshtastic-firmware LoRa device (e.g. RAK 4631) on USB.
    # The remote end needs no special firmware — stock Meshtastic ACKs suffice.
    #lora_link_tester:
    #  enabled: false
    #  serial_port: /dev/ttyACM1           # Dedicated test radio (NOT the gateway radio)
    #  target_node_id: "!abcd1234"         # Default target node (optional, set via dashboard)
    #  channel_index: 0                    # Meshtastic channel slot (0-7)
    #  probe_interval: 30                  # Seconds between probes (min 10)
    #  probe_count: 20                     # Probes per test run (0 = unlimited until stopped)
    #  probe_timeout: 30                   # Seconds to wait for ACK before declaring loss
    #  max_history: 500                    # Rolling result buffer size
    #  hop_limit: null                     # null = device default (3)
    #  reconnect_delay: 10                 # Base backoff on device loss (seconds)
    #  max_reconnect_attempts: 5           # Give up after N failures (0 = retry forever)

    # --- GPS telemetry --------------------------------------------------------
    # Reads NMEA 0183 from a USB GPS receiver (e.g. GlobalSat BU-353N) and
    # exposes position / altitude / speed / satellite state. Drives the
    # dashboard GPS panel and provides observer coordinates to space_tracker
    # (set observer.latitude/longitude to null in space_tracker to use GPS).
    # Requires: pip install reticulumpi[gps]
    #
    # Source modes:
    #   serial — read NMEA directly from USB serial device (default)
    #   gpsd   — read NMEA via gpsd TCP socket (allows sharing the GPS with
    #            chrony/ntp_server for GPS-disciplined time sync)
    #gps_telemetry:
    #  enabled: false
    #  source: serial                   # serial | gpsd
    #  serial_port: /dev/ttyUSB0        # Serial device (use a stable by-id/udev symlink where possible)
    #  baudrate: 4800                   # BU-353N default is 4800; many other pucks use 9600
    #  gpsd_host: localhost             # gpsd TCP host (source: gpsd only)
    #  gpsd_port: 2947                  # gpsd TCP port (source: gpsd only)
    #  read_timeout: 2.0                # Serial/TCP read timeout (seconds)
    #  reconnect_delay: 5               # Base backoff on device loss (seconds; exponential up to 300s)
    #  max_reconnect_attempts: 0        # 0 = retry forever
    #  fix_stale_seconds: 30            # Mark fix as lost if no RMC within this window
