# ReticulumPi forced-offline runtime overlay.
#
# This file is deliberately narrow. It is installed atomically as
# /var/lib/reticulumpi/runtime-overrides.yaml by the root-owned control helper;
# it must never replace /etc/reticulumpi/config.yaml. AppConfig rejects every
# runtime-override key except internet.force_offline.

internet:
  force_offline: true
