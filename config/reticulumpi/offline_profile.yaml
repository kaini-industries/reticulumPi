# ReticulumPi — Offline Profile
#
# This is a complete config for running without internet.  The following
# internet-dependent plugins are disabled:
#
#   info_bot           — all commands hit external APIs
#   space_tracker      — Celestrak, Launch Library, NOAA
#   meshtastic_gateway — configured in MQTT mode (mqtt.meshtastic.org)
#   transport_monitor  — probes external TCP hubs every 15s
#   yggdrasil_transport — internet overlay
#
# Everything else runs fully offline.  meshtastic_responder stays enabled
# because most of its commands work locally (!weather will return an error).
#
# Install with: sudo scripts/simulate_offline.sh on --with-profile
# Restore with: sudo scripts/simulate_offline.sh off --with-profile

reticulumpi:
  reticulum_config_dir: null
  use_shared_instance: true
  internet:
    force_offline: true
  identity_path: ~/.config/reticulumpi/identity
  log_level: 4
  plugin_paths: []
  plugins:
    heartbeat_announce:
      enabled: true
      interval_seconds: 600
      app_name: reticulumpi
      aspects:
      - node
      - heartbeat
      include_telemetry: true
    message_echo:
      enabled: false
      display_name: ReticulumPi Echo
      storage_path: ~/.local/share/reticulumpi/lxmf
    system_monitor:
      enabled: true
      collect_interval_seconds: 60
      metrics:
      - cpu_percent
      - cpu_temp
      - memory_percent
      - disk_percent
    nomadnet_server:
      enabled: true
      config_dir: ~/.nomadnet
      health_check_interval: 30
      auto_restart: true
      max_restarts: 5
    info_bot:
      enabled: false  # OFFLINE: all commands hit external APIs
      storage_path: ~/.local/share/reticulumpi/info_bot_lxmf
    meshchat_server:
      enabled: true
      install_dir: /opt/reticulumpi/meshchat
      host: 0.0.0.0
      port: 8000
      storage_dir: /opt/reticulumpi/meshchat/storage
      health_check_interval: 10
      auto_restart: true
      max_restarts: 5
    network_map:
      enabled: true
      db_path: ~/.local/share/reticulumpi/network_map.db
      max_history_days: 30
    mesh_telemetry:
      enabled: true
      announce_interval: 600
      include_metrics:
      - cpu_percent
      - cpu_temp
      - memory_percent
      - disk_percent
    sensor_framework:
      enabled: true
      read_interval: 30
      sensors:
      - name: cpu_temp
        driver: adc
        sysfs_path: /sys/class/thermal/thermal_zone0/temp
        scale: 0.001
        reading_name: temperature
      storage:
        type: sqlite
        path: ~/.local/share/reticulumpi/sensor_data.db
        retention_days: 30
    connectivity_monitor:
      enabled: true
      check_interval: 30
      log_path: ~/.local/share/reticulumpi/connectivity.log
      sam_port: 7656
      shared_instance_port: 37428
    transport_monitor:
      enabled: false  # OFFLINE: probes external TCP hubs every 15s
      check_interval: 15
      down_threshold: 60
      auto_teardown_fallback: true
      primary_hubs:
      - name: stoppedcold
        target_host: rns.stoppedcold.com
        target_port: 4242
      - name: liamcottle
        target_host: reticulum.liamcottle.net
        target_port: 4242
      fallback_hubs: []
      auto_discovery:
        enabled: true
        target_connections: 5
        probe_interval: 120
        cooldown_seconds: 300
        max_cooldown_seconds: 3600
        prefer_diverse_regions: true
    web_dashboard:
      enabled: true
      host: 0.0.0.0
      port: 8080
      session_timeout: 86400
      max_sessions: 5
      metrics_interval: 2
      max_websocket_clients: 10
    path_warmer:
      enabled: true
      warm_interval: 120
      max_requests_per_cycle: 3
      path_age_threshold: 600
      pre_send_timeout: 8
      warm_recently_seen: true
      warm_recent_hours: 24
      priority_nodes:
      - c99eced76cb1bbc2e6711b6fbea115eb
      - 611ed890ce0b13ab0a581563ffd044c0
    transport_health:
      enabled: true
      check_interval: 60
      db_path: ~/.local/share/reticulumpi/transport_health.db
      history_retention_hours: 168
      down_threshold_checks: 3
      degraded_threshold_pct: 80
      alert_on_critical_down: true
      critical_path_count: 5
    yggdrasil_transport:
      enabled: false  # OFFLINE: internet overlay network
      check_interval: 30
      auto_configure_rns: true
      rns_listen_port: 4243
    meshtastic_gateway:
      enabled: false  # OFFLINE: MQTT mode requires mqtt.meshtastic.org
      mode: mqtt
      device_probe_port: /dev/meshtastic
      device_probe_interval: 300
      meshtastic_channel: 0
      storage_path: ~/.local/share/reticulumpi/meshtastic_gw_lxmf
      max_messages_per_minute: 30
      mqtt:
        broker: mqtt.meshtastic.org
        port: 1883
        username: meshdev
        password: large4cats
        root_topic: msh/US/2/e/LongFast
        channel_key: AQ==
      lxmf_recipients: []
      meshtastic_allow_list: []
      lxmf_allow_list: []
      meshtastic_prefix: '[Mesh]'
      lxmf_prefix: '[LXMF]'
      health_check_interval: 30
      reconnect_grace_period: 90
      reconnect_delay: 10
      max_reconnect_attempts: 10
      advert_interval: 900
    meshtastic_responder:
      enabled: true
      prefix: '!'
      respond_to_broadcast: false
      cooldown_seconds: 10
      reply_via: lora
      commands: []
      custom_responses:
        hello: Hi from the mesh!
    meshcore_gateway:
      enabled: true
      serial_port: /dev/meshcore
      baudrate: 115200
      storage_path: ~/.local/share/reticulumpi/meshcore_gw
      max_messages_per_minute: 0
      health_check_interval: 30
      reconnect_delay: 10
      max_reconnect_attempts: 10
      advert_interval: 900
    meshcore_observer:
      enabled: false
      use_gateway_device: true
      iata: MSN
      mqtt_broker: mqtt-us-v1.letsmesh.net
      mqtt_port: 443
      mqtt_transport: websockets
      packet_queue_size: 1000
    messaging_hub:
      enabled: true
      db_path: ~/.local/share/reticulumpi/messaging_hub.db
      message_history_limit: 500
      lxmf:
        enabled: true
        storage_path: ~/.local/share/reticulumpi/messaging_hub_lxmf
      meshtastic:
        enabled: true
      meshcore:
        enabled: true
    mesh_bridge:
      enabled: true
      default_running: false
      channel_pairs:
      - meshtastic: 0
        meshcore: 0
        enabled: true
        direction: both
      tag_mesh: '[via Mesh]'
      tag_core: '[via Core]'
      auto_pause_threshold: 20
      log_dropped: true
    lora_diagnostics:
      enabled: true
      lora_interface_name: RNode LoRa Interface
      monitor_interval: 30
      beacon_interval: 120
      monitored_destinations:
      - hash: c99eced76cb1bbc2e6711b6fbea115eb
        name: Ratcom Cardputer
      - hash: 611ed890ce0b13ab0a581563ffd044c0
        name: MeshChat
    space_tracker:
      enabled: false  # OFFLINE: Celestrak, Launch Library, NOAA all require internet
      observer:
        latitude: 43.1205
        longitude: -89.3523
        elevation_m: 0
      celestrak_groups:
      - stations
      - amateur
      - weather
      tle_refresh_hours: 24
      launches:
        enabled: true
        poll_interval_minutes: 30
        lookahead_count: 5
      space_weather:
        enabled: true
        poll_interval_minutes: 15
      propagation:
        enabled: true
        interval_seconds: 10
        max_objects: 200
      passes:
        enabled: true
        lookahead_hours: 24
        min_elevation_deg: 10
        watchlist:
        - ISS (ZARYA)
        - CSS (TIANHE)
        - SAUDISAT 1C (SO-50)
        - JAS-2 (FO-29)
        - LILACSAT-2
        - FUNCUBE-1 (AO-73)
        - FOX-1CLIFF (AO-95)
        - DIWATA-2B
    gps_telemetry:
      enabled: true
      source: gpsd
      gpsd_host: localhost
      gpsd_port: 2947
      read_timeout: 2.0
      reconnect_delay: 5
      max_reconnect_attempts: 0
      fix_stale_seconds: 30
    adsb_radar:
      enabled: true
      device_index: "00000001"
      gain: max
      sbs_port: 30003
      stale_timeout: 300
      receiver_lat: 43.1205
      receiver_lon: -89.3523
    lora_scanner:
      enabled: false
    lora_chirp_viewer:
      enabled: false
    chirp_detector:
      enabled: false
      freq_mhz: 906.5
      sample_rate: 2048000
      gain_db: 34.0
      ppm: 0
      device_index: "14342860"
      waterfall_enabled: false
      detection_sfs: [7, 8, 9, 10, 11, 12]
      detection_bws: [125000, 250000, 500000]
    fm_receiver:
      enabled: true
      device_serial: "14342860"
      default_frequency_mhz: 95.5
      default_mode: wbfm
    spectrum_scanner:
      enabled: true
      freq_start_mhz: 52.0
      freq_stop_mhz: 2200.0
      bin_khz: 100.0
      sweep_seconds: 1
      gain_db: 34.0
      ppm: 0
      waterfall_rows: 256
      device_index: "07143901"
    ntp_server:
      enabled: true
      check_interval: 30
      manage_chrony_config: true
      chrony_conf_dir: /etc/chrony/conf.d
      sudo_chronyc: true
      gps_refclock:
        enabled: true
        shm_segment: 0
        pps_device: null
        precision: 1e-1
        offset: 0.0
        delay: 0.2
      alert_on_sync_loss: true
      sync_loss_threshold: 300
