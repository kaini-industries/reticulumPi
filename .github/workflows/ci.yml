name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          test "$("$RUNNER_TEMP/gitleaks" version)" = "$GITLEAKS_VERSION"
      - name: Scan full Git history for secrets
        run: "$RUNNER_TEMP/gitleaks git --redact --no-banner ."

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Audit hash-locked production profiles
        uses: pypa/gh-action-pip-audit@fb241f581674a1bb995061d62504857a9ea4b69e # post-v1.1.0 stable disable-pip input
        with:
          inputs: >-
            constraints/production-universal-core.txt
            constraints/production-universal-dashboard-nomadnet.txt
            constraints/production-universal-all-features.txt
          require-hashes: true
          disable-pip: true
          no-deps: true

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify committed dashboard build output
        run: |
          npm ci
          npm run check:dashboard
      - name: Install project tooling
        run: python -m pip install ".[dev,dashboard]"
      - run: ruff check src/ tests/ plugins/ tools/
      - run: ruff format --check src/ tests/ plugins/ tools/
      - name: Validate documentation and CLI help snapshots
        run: python tools/check_docs.py
      - name: Validate shell, YAML, and Compose files
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck systemd sudo
          shellcheck scripts/*.sh docker/entrypoint.sh tools/*.sh
          bash -n scripts/*.sh docker/entrypoint.sh tools/*.sh
          find src/reticulumpi/builtin_plugins/web_dashboard/static tools \
            -type f -name '*.js' -exec node --check {} \;
          python - <<'PY'
          from pathlib import Path
          import yaml
          from reticulumpi.config import AppConfig

          for path in [*Path("config").rglob("*.yaml"), *Path("docker").rglob("*.yaml")]:
              yaml.safe_load(path.read_text())
              print(path)
          for path in (
              Path("config/reticulumpi/config.example.yaml"),
              Path("config/reticulumpi/config.development.example.yaml"),
              Path("docker/config.example.yaml"),
              Path("docker/config.ci.yaml"),
          ):
              AppConfig(str(path))
          PY
          docker compose -f docker/docker-compose.yml config --quiet
      - name: Validate privileged policy and systemd units
        run: |
          test ! -d config/sudoers.d || test -z "$(find config/sudoers.d -type f -print -quit)"
          id -u reticulumpi >/dev/null 2>&1 || sudo useradd --system --home /var/lib/reticulumpi reticulumpi
          sudo install -d /opt/reticulumpi/current/.venv/bin /var/lib/reticulumpi
          sudo ln -sf /usr/bin/python3 /opt/reticulumpi/current/.venv/bin/python
          sudo ln -sf /bin/true /opt/reticulumpi/current/.venv/bin/reticulumpi
          sudo ln -sf /bin/true /opt/reticulumpi/current/.venv/bin/rnsd
          systemd-analyze verify systemd/*.service systemd/*.socket systemd/*.timer

  dashboard-browser:
    name: Dashboard browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install ".[dashboard]"
      - run: npm ci
      - name: Install browser runtime
        run: npx playwright install --with-deps "${{ matrix.browser }}"
      - name: Run CSP, axe, and responsive gates
        env:
          RETICULUMPI_PLAYWRIGHT_OUTPUT: playwright-results
        run: npx playwright test --project="${{ matrix.browser }}" --grep-invert="@performance"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}-failure
          path: playwright-results/
          if-no-files-found: ignore

  dashboard-performance:
    name: Dashboard slow-LAN performance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install ".[dashboard]"
      - run: npm ci
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Enforce slow-LAN, Web Vitals, main-thread, and frame-rate gates
        env:
          RETICULUMPI_PLAYWRIGHT_OUTPUT: playwright-performance-results
        run: >-
          npx playwright test tests/browser/performance.spec.mjs
          --project=chromium --workers=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-performance-failure
          path: playwright-performance-results/
          if-no-files-found: ignore

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,dashboard]"
      - name: Run parallel test suite
        run: pytest tests/ -v -n auto

  coverage:
    name: Serial coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,dashboard]"
      # Use a filesystem source root because built-ins are also loaded under
      # compatibility module names; package-name filtering would cache those
      # files as untraceable before their canonical imports.
      - run: pytest tests/ -v -n0 --cov=src/reticulumpi --cov-branch --cov-report=term-missing --cov-report=xml
      - name: Enforce aggregate, changed-code, and critical-module coverage
        env:
          COVERAGE_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.3.7' }}
        run: >-
          python tools/check_coverage_gate.py
          --coverage-xml coverage.xml
          --repo-root .
          --release-version "$COVERAGE_RELEASE_VERSION"
          --github-event "$GITHUB_EVENT_PATH"
          --github-event-name "$GITHUB_EVENT_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml

  release-tag-trust:
    name: Cryptographically verify release tag
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the configured OpenPGP signer
        env:
          RELEASE_TAG_PUBLIC_KEY: ${{ vars.RELEASE_TAG_PUBLIC_KEY }}
          RELEASE_TAG_FINGERPRINT: ${{ vars.RELEASE_TAG_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG_PUBLIC_KEY"
          test -n "$RELEASE_TAG_FINGERPRINT"
          [[ $GITHUB_REF_NAME =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(command -v git)" = /usr/bin/git
          test "$(command -v gpg)" = /usr/bin/gpg
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{}")" = "$GITHUB_SHA"
          tag_key="$RUNNER_TEMP/reticulumpi-release-tag.asc"
          tag_keyring="$RUNNER_TEMP/reticulumpi-release-tag-keyring"
          tag_status="$RUNNER_TEMP/reticulumpi-release-tag.status"
          printf '%s\n' "$RELEASE_TAG_PUBLIC_KEY" > "$tag_key"
          chmod 0644 "$tag_key"
          mkdir -m 0700 "$tag_keyring"
          cleanup_tag_key() {
            rm -f "$tag_key" "$tag_status"
            rm -rf "$tag_keyring"
          }
          trap cleanup_tag_key EXIT
          expected=${RELEASE_TAG_FINGERPRINT//[[:space:]]/}
          expected=${expected^^}
          [[ $expected =~ ^([0-9A-F]{40}|[0-9A-F]{64})$ ]]
          GNUPGHOME="$tag_keyring" /usr/bin/gpg --batch --with-colons \
            --import-options show-only --import "$tag_key" |
            awk -F: '$1 == "fpr" {print toupper($10)}' |
            grep --fixed-strings --line-regexp "$expected" >/dev/null
          GNUPGHOME="$tag_keyring" /usr/bin/gpg --batch \
            --import "$tag_key" >/dev/null 2>&1
          if ! GNUPGHOME="$tag_keyring" /usr/bin/git \
            -c gpg.format=openpgp \
            -c gpg.program=/usr/bin/gpg \
            verify-tag --raw "$GITHUB_REF_NAME" >"$tag_status" 2>&1; then
            echo "release tag failed cryptographic verification" >&2
            exit 1
          fi
          awk -v expected="$expected" '
            $1 == "[GNUPG:]" && $2 == "VALIDSIG" {
              for (field = 3; field <= NF; field++) {
                if (toupper($field) == expected) found = 1
              }
            }
            END { exit(found ? 0 : 1) }
          ' "$tag_status" || {
            echo "release tag was not signed by the configured fingerprint" >&2
            exit 1
          }

  package:
    name: Installed wheel smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref || github.sha }}
          fetch-depth: 0
      - name: Bind package build to the exact annotated tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{}")" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install hash-locked release tooling
        run: >-
          python -m pip install --require-hashes --only-binary :all:
          --requirement constraints/production-universal-build.txt
      - run: python -m build --no-isolation
      - run: twine check dist/*
      - name: Prepare the exact wheel for SBOM generation
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/reticulumpi-*.whl)
          test "${#wheels[@]}" -eq 1
          sbom_root="$RUNNER_TEMP/reticulumpi-wheel-root"
          test ! -e "$sbom_root"
          install -d -m 0755 "$sbom_root"
          python -m zipfile -e "${wheels[0]}" "$sbom_root"
          set -- "$sbom_root"/reticulumpi-*.dist-info/METADATA
          test "$#" -eq 1
          test -f "$1"
      - name: Generate exact-wheel CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ runner.temp }}/reticulumpi-wheel-root
          format: cyclonedx-json
          output-file: dist/reticulumpi.cdx.json
          artifact-name: reticulumpi-sbom.cdx.json
          upload-release-assets: false
      - name: Verify CycloneDX SBOM
        run: python tools/verify_sbom.py dist/reticulumpi.cdx.json
      - name: Validate signed tag and artifact versions
        if: github.ref_type == 'tag'
        run: >-
          python tools/verify_release_tag.py --require-signature
          "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz
      - name: Smoke-test installed wheel with hash-locked runtime dependencies
        run: >-
          python scripts/verify_wheel.py dist/*.whl
          --requirements constraints/production-universal-dashboard-nomadnet.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  recovery-admin:
    name: Build profile-specific recovery administrators
    runs-on: ubuntu-24.04
    needs: package
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Build both recovery packages from the exact validated wheel
        run: |
          set -euo pipefail
          set -- dist/*.whl
          test "$#" -eq 1
          wheel=$1
          wheel_sha256=$(sha256sum "$wheel" | cut -d ' ' -f 1)
          version=$(python - "$wheel" <<'PY'
          import email.parser
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(names) != 1:
                  raise SystemExit("wheel must contain exactly one METADATA file")
              metadata = email.parser.BytesParser().parsebytes(archive.read(names[0]))
          if metadata.get("Name", "").casefold() != "reticulumpi":
              raise SystemExit("wheel metadata does not identify ReticulumPi")
          print(metadata["Version"])
          PY
          )
          source_date_epoch=$(git show -s --format=%ct HEAD)
          mkdir -m 0755 admin-dist admin-runtime
          : > admin-runtime.SHA256SUMS
          for profile in \
            linux-arm64-debian-bookworm-py311 \
            linux-arm64-ubuntu-noble-py312; do
            output="admin-dist/reticulumpi-admin_${version}_${profile}_arm64.deb"
            python tools/build_admin_deb.py \
              --wheel "$wheel" \
              --wheel-sha256 "$wheel_sha256" \
              --runtime-kind site-packages \
              --runtime-source admin-runtime \
              --runtime-manifest admin-runtime.SHA256SUMS \
              --platform-profile "$profile" \
              --version "$version" \
              --source-date-epoch "$source_date_epoch" \
              --output "$output"
          done
          test "$(find admin-dist -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 2
          test "$(find admin-dist -maxdepth 1 -type f -name '*.deb.sha256' | wc -l)" -eq 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recovery-administrators
          path: admin-dist/
          if-no-files-found: error

  container:
    name: Container build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
            pytest_workers: 2
            pytest_timeout: 60
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
            pytest_workers: 0
            pytest_timeout: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build test target
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          platforms: ${{ matrix.platform }}
          build-args: |
            PYTEST_WORKERS=${{ matrix.pytest_workers }}
            PYTEST_TIMEOUT=${{ matrix.pytest_timeout }}
          push: false
          tags: reticulumpi-test:${{ matrix.suffix }}
      - name: Build runtime target from the same wheel
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          provenance: false
          sbom: false
          tags: reticulumpi:${{ matrix.suffix }}
      - name: Report all runtime image vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: reticulumpi:${{ matrix.suffix }}
          fail-build: false
          severity-cutoff: high
          only-fixed: false
          output-format: json
          output-file: grype-all-${{ matrix.suffix }}.json
          grype-version: v0.110.0
          cache-db: true
      - name: Upload complete runtime vulnerability report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vulnerability-report-${{ matrix.suffix }}
          path: grype-all-${{ matrix.suffix }}.json
          if-no-files-found: error
      - name: Enforce actionable high-severity vulnerability gate
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: reticulumpi:${{ matrix.suffix }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
          grype-version: v0.110.0
          vex: docker/security/python-3.14.7-grype-db-bridge.openvex.json
          cache-db: true
      - name: Verify minimal runtime, readiness, shutdown, and durable recreation
        run: >-
          tools/verify_container_runtime.sh
          reticulumpi:${{ matrix.suffix }}
          ${{ matrix.platform }}
      - name: Export the exact validated runtime image
        run: |
          set -euo pipefail
          archive="reticulumpi-${{ matrix.suffix }}.tar.gz"
          docker save "reticulumpi:${{ matrix.suffix }}" |
            gzip -9n > "$archive"
          sha256sum "$archive" > "${archive}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-image-${{ matrix.suffix }}
          path: |
            reticulumpi-${{ matrix.suffix }}.tar.gz
            reticulumpi-${{ matrix.suffix }}.tar.gz.sha256
          if-no-files-found: error

  bookworm-systemd:
    name: ARM64 Bookworm systemd install and rollback
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.package.result == 'success' &&
      needs['recovery-admin'].result == 'success' &&
      (github.ref_type != 'tag' || needs['release-tag-trust'].result == 'success')
    runs-on: ubuntu-24.04-arm
    needs:
      - package
      - recovery-admin
      - release-tag-trust
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: recovery-administrators
          path: admin-dist
      - name: Install and import the complete hash-locked ARM64 feature profile
        run: |
          docker build \
            --platform linux/arm64 \
            --file docker/arm64-all-features-ci.Dockerfile \
            --tag reticulumpi-all-features-ci:${GITHUB_RUN_ID} \
            .
          docker run --rm --platform linux/arm64 \
            reticulumpi-all-features-ci:${GITHUB_RUN_ID}
      - name: Build the digest-pinned Bookworm systemd fixture
        run: >-
          docker build
          --platform linux/arm64
          --file docker/systemd-ci.Dockerfile
          --tag reticulumpi-systemd-ci:${GITHUB_RUN_ID}
          .
      - name: Run installation, recovery, and rollback gates under systemd
        run: |
          set -euo pipefail
          containers=()
          cleanup() {
            status=$?
            if (( status != 0 )); then
              for container in "${containers[@]}"; do
                docker logs "$container" >&2 || true
              done
            fi
            for container in "${containers[@]}"; do
              docker rm --force "$container" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT
          for install_root in /opt/reticulumpi /srv/reticulumpi; do
            suffix=${install_root#/}
            suffix=${suffix//\//-}
            container="reticulumpi-systemd-ci-${suffix}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            containers+=("$container")
            docker run --detach \
              --platform linux/arm64 \
              --name "$container" \
              --privileged \
              --cgroupns=host \
              --volume /sys/fs/cgroup:/sys/fs/cgroup:rw \
              --tmpfs /run \
              --tmpfs /run/lock \
              "reticulumpi-systemd-ci:${GITHUB_RUN_ID}" >/dev/null
            docker exec --env RETICULUMPI_CI_INSTALL_ROOT="$install_root" \
              "$container" tools/verify_bookworm_systemd.sh
            test "$(docker inspect --format '{{.State.Running}}' "$container")" = true
          done

  noble-systemd:
    name: ARM64 Ubuntu Noble systemd install and rollback
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.package.result == 'success' &&
      needs['recovery-admin'].result == 'success' &&
      (github.ref_type != 'tag' || needs['release-tag-trust'].result == 'success')
    runs-on: ubuntu-24.04-arm
    needs:
      - package
      - recovery-admin
      - release-tag-trust
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: recovery-administrators
          path: admin-dist
      - name: Build the digest-pinned Ubuntu Noble systemd fixture
        run: >-
          docker build
          --platform linux/arm64
          --file docker/noble-systemd-ci.Dockerfile
          --tag reticulumpi-noble-systemd-ci:${GITHUB_RUN_ID}
          .
      - name: Run Noble installation, recovery, and rollback gates under systemd
        run: |
          set -euo pipefail
          containers=()
          cleanup() {
            status=$?
            if (( status != 0 )); then
              for container in "${containers[@]}"; do
                docker logs "$container" >&2 || true
              done
            fi
            for container in "${containers[@]}"; do
              docker rm --force "$container" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT
          scenarios=(
            "fresh:/opt/reticulumpi"
            "fresh:/srv/reticulumpi"
            "legacy-bridge:/srv/reticulumpi"
          )
          for entry in "${scenarios[@]}"; do
            scenario=${entry%%:*}
            install_root=${entry#*:}
            suffix=${install_root#/}
            suffix=${suffix//\//-}
            container="reticulumpi-noble-systemd-ci-${scenario}-${suffix}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            containers+=("$container")
            docker run --detach \
              --platform linux/arm64 \
              --name "$container" \
              --privileged \
              --cgroupns=host \
              --volume /sys/fs/cgroup:/sys/fs/cgroup:rw \
              --tmpfs /run \
              --tmpfs /run/lock \
              "reticulumpi-noble-systemd-ci:${GITHUB_RUN_ID}" >/dev/null
            docker exec \
              --env RETICULUMPI_CI_INSTALL_ROOT="$install_root" \
              --env RETICULUMPI_CI_SCENARIO="$scenario" \
              "$container" tools/verify_noble_systemd.sh
            test "$(docker inspect --format '{{.State.Running}}' "$container")" = true
          done

  release-inputs:
    name: Prepare offline release-signing inputs
    if: >-
      github.run_attempt == 1 &&
      github.ref_type == 'tag' &&
      needs['release-tag-trust'].result == 'success' &&
      needs['dashboard-performance'].result == 'success' &&
      needs['bookworm-systemd'].result == 'success' &&
      needs['noble-systemd'].result == 'success' &&
      needs['recovery-admin'].result == 'success'
    needs:
      - secret-scan
      - dependency-audit
      - static-analysis
      - dashboard-browser
      - dashboard-performance
      - test
      - coverage
      - release-tag-trust
      - package
      - recovery-admin
      - container
      - bookworm-systemd
      - noble-systemd
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      RETICULUMPI_RUN_ADMISSION_FILTER: |
        def positive_integer:
          if type == "number" then . > 0 and floor == . else false end;
        def nonnegative_integer:
          if type == "number" then . >= 0 and floor == . else false end;
        def exact_repository($name):
          type == "object" and .full_name == $name;
        . as $selected
        | $pages[0] as $page_list
        | [$page_list[].workflow_runs[]] as $loaded
        | [$page_list[].total_count] as $totals
        | [$loaded[] | select(.event == $event and .head_branch == $tag)] as $matching
        | [$matching[] | select((.id | tostring) == $run_id)] as $selected_rows
        | ($selected | type) == "object"
          and ($selected.id | positive_integer)
          and (($selected.id | tostring) == $run_id)
          and ($selected.run_number | positive_integer)
          and ($selected.run_attempt | positive_integer)
          and ($selected.run_attempt == 1)
          and ($selected.workflow_id | positive_integer)
          and ($selected.event == $event)
          and ($selected.head_branch == $tag)
          and ($selected.head_sha == $sha)
          and ($selected.repository | exact_repository($repository))
          and ($selected.head_repository | exact_repository($repository))
          and (($require_success == false) or (
            $selected.status == "completed" and $selected.conclusion == "success"
          ))
          and ($workflow | length == 1)
          and (($workflow[0] | type) == "object")
          and ($workflow[0].id == $selected.workflow_id)
          and ($workflow[0].path == $workflow_path)
          and ($pages | length == 1)
          and (($page_list | type) == "array")
          and ($page_list | length > 0)
          and all($page_list[];
            (.total_count | nonnegative_integer) and ((.workflow_runs | type) == "array")
          )
          and (($totals | unique | length) == 1)
          and ($totals[0] == ($loaded | length))
          and (($loaded | length) < 1000)
          and all($matching[];
            (.id | positive_integer)
            and (.run_number | positive_integer)
            and (.run_attempt | positive_integer)
            and (.workflow_id == $selected.workflow_id)
            and (.repository | exact_repository($repository))
            and (.head_repository | exact_repository($repository))
          )
          and (($selected_rows | length) == 1)
          and ($selected_rows[0].run_number == $selected.run_number)
          and ($selected_rows[0].run_attempt == $selected.run_attempt)
          and ($selected_rows[0].head_sha == $selected.head_sha)
          and (([
            $matching[] | select(.run_number == $selected.run_number)
          ] | length) == 1)
          and all($matching[]; .run_number >= $selected.run_number)
    steps:
      - name: Refuse a non-initial tag source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF" = "refs/tags/$GITHUB_REF_NAME"
          [[ $GITHUB_REF_NAME =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ $GITHUB_SHA =~ ^[0-9a-f]{40}$ ]]
          require_initial_run() {
            local label=$1
            local run_id=$2
            local event=$3
            local workflow_path=$4
            local require_success=$5
            [[ $label =~ ^[a-z-]+$ ]]
            [[ $run_id =~ ^[1-9][0-9]*$ ]]
            local run_json="$RUNNER_TEMP/$label-run.json"
            local workflow_json="$RUNNER_TEMP/$label-workflow.json"
            local runs_json="$RUNNER_TEMP/$label-runs.json"
            gh api --method GET \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$run_json"
            local workflow_id
            workflow_id=$(jq -er \
              '.workflow_id | select(type == "number" and . > 0 and floor == .)' \
              "$run_json")
            gh api --method GET \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" \
              > "$workflow_json"
            gh api --method GET --paginate --slurp \
              -f event="$event" \
              -f per_page=100 \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs" \
              > "$runs_json"
            jq -e \
              --arg run_id "$run_id" \
              --arg event "$event" \
              --arg tag "$GITHUB_REF_NAME" \
              --arg sha "$GITHUB_SHA" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg workflow_path "$workflow_path" \
              --argjson require_success "$require_success" \
              --slurpfile workflow "$workflow_json" \
              --slurpfile pages "$runs_json" \
              "$RETICULUMPI_RUN_ADMISSION_FILTER" \
              "$run_json" >/dev/null
          }
          require_initial_run source "$GITHUB_RUN_ID" push .github/workflows/ci.yml false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: release-input/python
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-image-amd64
          path: release-input/images/amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-image-arm64
          path: release-input/images/arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: recovery-administrators
          path: release-input/recovery-admin
      - name: Validate exact artifacts and prepare the offline signing request
        run: |
          set -euo pipefail
          source_date_epoch=$(git show -s --format=%ct HEAD)
          python -m tools.offline_release prepare-inputs \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --source-run-id "$GITHUB_RUN_ID" \
            --source-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-date-epoch "$source_date_epoch" \
            --input-directory release-input
          test -f release-input/RELEASE-INPUTS.SHA256SUMS
          test ! -L release-input/RELEASE-INPUTS.SHA256SUMS
      - name: Attest the exact offline-signing input manifest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: release-input/RELEASE-INPUTS.SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-signing-input-${{ github.ref_name }}
          path: release-input/
          if-no-files-found: error
          retention-days: 30
